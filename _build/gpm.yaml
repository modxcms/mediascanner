name: MediaScanner
version: 1.1.0
lowCaseName: mediascanner
namespace: MediaScanner
description: "Scan unused media"
author: not matdave
menus:
    - text: mediascanner.menu
      description: mediascanner.menu_desc
      action: manage
plugins:
    - name: MediaScanner
      events:
          - OnDocFormPrerender
          - OnDocFormSave
          - OnEmptyTrash
systemSettings:
    - key: allow_regenerate_button
      value: 1
      type: combo-boolean
    - key: generate_on_save
      value: 1
      type: combo-boolean
database:
    tables:
        - MediaScanner\Model\Media
        - MediaScanner\Model\MediaResources
build:
    license: LICENSE.md
    changelog: CHANGELOG.md
    readme: README.md
