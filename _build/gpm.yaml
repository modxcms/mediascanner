name: MediaScanner
version: 1.1.2
lowCaseName: mediascanner
namespace: MediaScanner
description: Scan unused media
author: not matdave
menus:
  - text: mediascanner.menu
    description: mediascanner.menu_desc
    action: manage
    parent: media
plugins:
  - name: MediaScanner
    events:
      - OnDocFormPrerender
      - OnDocFormSave
      - OnEmptyTrash
systemSettings:
  - key: allow_regenerate_button
    value: 1
    type: combo-boolean
  - key: scan_on_save
    value: 1
    type: combo-boolean
  - key: skip_scan
database:
  tables:
    - MediaScanner\v3\Model\Media
    - MediaScanner\v3\Model\MediaResources
build:
  license: LICENSE.md
  changelog: CHANGELOG.md
  readme: README.md
